[package]
name = "ring-db"
version = "0.9.1"
edition = "2024"
description = "Exact vector search with typed filters and durable storage, on a CPU or a Vulkan GPU."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/mathias-vandaele/ring-db"
documentation = "https://docs.rs/ring-db"

[lib]
name = "ringdb"
path = "src/lib.rs"

[[example]]
name = "cli"
path = "examples/cli.rs"

[[bench]]
name = "query_backends"
path = "benches/query_backends.rs"
harness = false

[[bench]]
name = "backend_compare"
path = "benches/backend_compare.rs"
harness = false

[dependencies]
rayon = "1.11.0"
thiserror = "2"
smallvec = { version = "1.15", features = ["const_generics"] }
bytemuck = { version = "1", features = ["derive", "extern_crate_alloc"] }
ash = { version = "0.38", default-features = false, features = ["loaded", "std"] }
crc32fast = "1"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
rand = { version = "0.10.0", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
