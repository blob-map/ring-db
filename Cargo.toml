[package]
name = "ring-db"
version = "0.8.1"
edition = "2024"
description = "Exact CPU and CUDA vector search with ring queries, weighted KNN, and metadata filtering."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/mathias-vandaele/ring-db"
documentation = "https://docs.rs/ring-db"

[lib]
name = "ringdb"
path = "src/lib.rs"

[features]
default = []
cuda = []

[[example]]
name = "cli"
path = "examples/cli.rs"

[[bench]]
name = "query_backends"
path = "benches/query_backends.rs"
harness = false

[dependencies]
rayon = "1.11.0"
thiserror = "2"
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
rand = { version = "0.10.0", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
